version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repointel-postgres
    environment:
      POSTGRES_USER: repointel
      POSTGRES_PASSWORD: repointel_pass
      POSTGRES_DB: repointel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repointel -d repointel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: repointel-neo4j
    environment:
      NEO4J_AUTH: neo4j/repointel_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "repointel_pass", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repointel-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=repointel
      - POSTGRES_PASSWORD=repointel_pass
      - POSTGRES_DB=repointel_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=repointel_pass
      - LLM_PROVIDER=mock
      - AUTO_INDEX_SAMPLE=true
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app/repo_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repointel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
